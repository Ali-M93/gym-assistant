name: ترجمة التمارين

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "عدد التمارين بهذا الجزء"
        default: "150"

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Translate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          LIMIT: ${{ inputs.limit }}
        run: python tools/translate.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/exercises_ar.json data/translate_log.txt || true
          git diff --cached --quiet || git commit -m "Update Arabic exercises translation"
          git push
