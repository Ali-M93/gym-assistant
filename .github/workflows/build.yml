name: بناء التطبيق (APK + AAB)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "assets/**"
      - "data/exercises_ar.json"
      - "tool/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # معرّف التطبيق ثابت للأبد بعد النشر: com.alim.gym_assistant
      - name: Generate Android project
        run: |
          flutter create --org com.alim --project-name gym_assistant --platforms android . 2>&1 | tee ci_log.txt
          rm -rf test

      # مفتاح الرفع مشفّر داخل المستودع، والسر الوحيد هو KEYSTORE_PASSWORD
      - name: Signing key
        env:
          KS_PASS_RAW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          P=$(printf '%s' "$KS_PASS_RAW" | tr -d '[:space:]')
          if [ -z "$P" ]; then
            echo "::warning::KEYSTORE_PASSWORD مو موجود — النسخة راح تكون بمفتاح تجريبي وما تنرفع على Google Play"
            exit 0
          fi
          echo "::add-mask::$P"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in tool/upload-key.jks.enc \
            -out "$RUNNER_TEMP/release.jks" -pass "pass:$P" 2>/dev/null \
            || { echo "::error::KEYSTORE_PASSWORD غلط"; exit 1; }
          SUM=$(sha256sum "$RUNNER_TEMP/release.jks" | cut -c1-64)
          [ "$SUM" = "0a3b7dc9a19e6976878eef1aa277d1022ebcd5b9a40fec43d5257093ff17b33e" ] \
            || { echo "::error::KEYSTORE_PASSWORD غلط (المفتاح ما انفك صح)"; exit 1; }
          { echo "KS_PATH=$RUNNER_TEMP/release.jks"; echo "KS_PASS=$P"; echo "KS_ALIAS=upload"; } >> "$GITHUB_ENV"

      - name: Patch Android
        run: python3 tool/patch_android.py | tee -a ci_log.txt

      - name: Dependencies and icons
        run: |
          flutter pub get 2>&1 | tee -a ci_log.txt
          dart run flutter_launcher_icons 2>&1 | tee -a ci_log.txt

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a ci_log.txt

      - name: Build APK + AAB
        run: |
          V="--build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}"
          flutter build apk --release $V 2>&1 | tee -a ci_log.txt
          flutter build appbundle --release $V 2>&1 | tee -a ci_log.txt
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/gym-assistant.apk
          cp build/app/outputs/bundle/release/app-release.aab out/gym-assistant.aab

      - name: Verify signing
        run: |
          keytool -printcert -jarfile out/gym-assistant.aab | tee signer.txt | head -5
          if [ -n "$KS_PATH" ]; then
            grep -q "Gym Assistant" signer.txt || { echo "::error::AAB غير موقّع بالمفتاح الرسمي"; exit 1; }
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest out/gym-assistant.apk out/gym-assistant.aab \
            --title "مساعد الجم — نسخة 1.0.${{ github.run_number }}" \
            --notes "ثبّت gym-assistant.apk على التلفون. ملف gym-assistant.aab لرفعه على Google Play."

      - name: Save log on failure
        if: failure()
        run: |
          mkdir -p ci
          cp ci_log.txt ci/build_log.txt || echo "no log" > ci/build_log.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ci/build_log.txt
          git commit -m "CI build log [skip ci]" && git push || true
