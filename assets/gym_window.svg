<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="400" height="640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#2a1145"/><stop offset="1" stop-color="#0b0614"/>
    </radialGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b56cff"/><stop offset="1" stop-color="#5a1fa8"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b3fe4"/><stop offset="1" stop-color="#2d0b63"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3b6ff"/><stop offset="1" stop-color="#8a3ad6"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d8e6"/><stop offset=".5" stop-color="#6c6c80"/><stop offset="1" stop-color="#2b2b38"/>
    </linearGradient>
    <clipPath id="win"><path d="M60 600 V250 Q60 90 200 40 Q340 90 340 250 V600 Z"/></clipPath>
    <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="400" height="640" fill="url(#bg)"/>
  <!-- glow behind window -->
  <path d="M60 600 V250 Q60 90 200 40 Q340 90 340 250 V600 Z" fill="#8a3ad6" opacity=".35" filter="url(#glow)"/>
  <g clip-path="url(#win)">
    <!-- glass panes -->
    <rect x="60" y="40" width="280" height="560" fill="url(#g2)"/>
    <path d="M60 40 L200 250 L340 40 Z" fill="url(#g1)" opacity=".8"/>
    <path d="M60 250 L200 250 L60 420 Z" fill="url(#g3)" opacity=".45"/>
    <path d="M340 250 L200 250 L340 420 Z" fill="url(#g3)" opacity=".45"/>
    <path d="M60 420 L200 600 L60 600 Z" fill="url(#g1)" opacity=".5"/>
    <path d="M340 420 L200 600 L340 600 Z" fill="url(#g1)" opacity=".5"/>
    <!-- lead lines (stained glass came) -->
    <g stroke="#120820" stroke-width="5" fill="none">
      <path d="M60 40 L200 250 L340 40"/>
      <line x1="60" y1="250" x2="340" y2="250"/>
      <path d="M60 420 L200 250 L340 420"/>
      <path d="M60 420 L200 600 L340 420"/>
      <line x1="200" y1="250" x2="200" y2="600"/>
      <line x1="60" y1="440" x2="340" y2="440"/>
    </g>
    <!-- rose window: weight plate -->
    <g transform="translate(200 175)">
      <circle r="62" fill="url(#iron)" stroke="#120820" stroke-width="5"/>
      <circle r="44" fill="none" stroke="#120820" stroke-width="3"/>
      <circle r="12" fill="#1a0d2e" stroke="#120820" stroke-width="4"/>
      <g stroke="#120820" stroke-width="3">
        <line x1="0" y1="-44" x2="0" y2="-12"/><line x1="0" y1="12" x2="0" y2="44"/>
        <line x1="-44" y1="0" x2="-12" y2="0"/><line x1="12" y1="0" x2="44" y2="0"/>
      </g>
      <text y="-48" text-anchor="middle" font-family="Arial Black,Arial" font-size="11" fill="#2a1145">20 KG</text>
    </g>
    <!-- dumbbell in center -->
    <g transform="translate(200 345)">
      <rect x="-70" y="-6" width="140" height="12" rx="4" fill="url(#iron)" stroke="#120820" stroke-width="3"/>
      <rect x="-82" y="-36" width="22" height="72" rx="5" fill="url(#iron)" stroke="#120820" stroke-width="4"/>
      <rect x="-104" y="-28" width="22" height="56" rx="5" fill="url(#iron)" stroke="#120820" stroke-width="4"/>
      <rect x="60" y="-36" width="22" height="72" rx="5" fill="url(#iron)" stroke="#120820" stroke-width="4"/>
      <rect x="82" y="-28" width="22" height="56" rx="5" fill="url(#iron)" stroke="#120820" stroke-width="4"/>
    </g>
    <!-- kettlebells bottom -->
    <g transform="translate(130 500)">
      <path d="M-18 -30 Q0 -58 18 -30" fill="none" stroke="url(#iron)" stroke-width="10"/>
      <circle cy="0" r="32" fill="url(#iron)" stroke="#120820" stroke-width="4"/>
    </g>
    <g transform="translate(270 500)">
      <path d="M-18 -30 Q0 -58 18 -30" fill="none" stroke="url(#iron)" stroke-width="10"/>
      <circle cy="0" r="32" fill="url(#iron)" stroke="#120820" stroke-width="4"/>
    </g>
  </g>
  <!-- stone frame with thorns -->
  <path d="M60 600 V250 Q60 90 200 40 Q340 90 340 250 V600" fill="none" stroke="#3b2557" stroke-width="16"/>
  <path d="M60 600 V250 Q60 90 200 40 Q340 90 340 250 V600" fill="none" stroke="#7d5aa6" stroke-width="3"/>
  <g fill="#3b2557" stroke="#7d5aa6" stroke-width="1.5">
    <path d="M52 560 l-18 -8 l18 -6Z"/><path d="M52 480 l-20 -6 l20 -8Z"/><path d="M52 400 l-18 -8 l18 -6Z"/>
    <path d="M52 320 l-20 -6 l20 -8Z"/><path d="M58 240 l-20 -12 l22 -2Z"/><path d="M90 150 l-18 -16 l24 2Z"/>
    <path d="M140 85 l-10 -20 l20 8Z"/><path d="M200 32 l0 -22 l10 20Z"/><path d="M260 85 l10 -20 l-20 8Z"/>
    <path d="M310 150 l18 -16 l-24 2Z"/><path d="M342 240 l20 -12 l-22 -2Z"/><path d="M348 320 l20 -6 l-20 -8Z"/>
    <path d="M348 400 l18 -8 l-18 -6Z"/><path d="M348 480 l20 -6 l-20 -8Z"/><path d="M348 560 l18 -8 l-18 -6Z"/>
  </g>
</svg>
